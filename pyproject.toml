[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "g3"
version = "0.6.1.6"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10,<13",
    "websockets>=15,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["g3_tests"]

[project.scripts]
g3 = "g3_launcher.__main__:main"

[tool.setuptools.packages.find]
include = ["g3_core*", "g3_launcher*"]
exclude = ["g3_tests*", "g3_tools*", "g3_frontend*"]
namespaces = false

[tool.setuptools.package-data]
g3_core = ["schema.sql"]
